# Option B: run the Temporal dev server in Docker instead of installing the CLI.
#   docker compose up -d
# gRPC: localhost:7233   Web UI: http://localhost:8233
services:
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data

volumes:
  temporal-data:
