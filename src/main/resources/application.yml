server:
  port: 8080

spring:
  application:
    name: order-service
  temporal:
    namespace: default
    connection:
      # Local dev server started with: temporal server start-dev
      target: ${TEMPORAL_TARGET:localhost:7233}
    workers-auto-discovery:
      # Without this, only workflows are registered and activities never run
      register-activity-beans: true
      workflow-packages:
        - com.acme.orders

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.acme.orders: INFO
